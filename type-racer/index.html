<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | سباق الكتابة</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #b8abd5">
<header class="appbar">
<a class="brand" href="./">سباق الكتابة<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">← جميع المشاريع</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">ستوديو أحمد / عرض تفاعلي</span>
<h1>ابحث عن إيقاعك على المفاتيح.</h1>
</div>
<span class="muted">محلي أولاً · لا يلزم وجود حساب</span>
</div>
<div class="grid cols2">
<section class="panel">
<div class="row">
<h2>جلسة الكتابة</h2>
<select aria-label="مدة الجلسة" id="duration">
<option value="30">30 ثانية</option>
<option selected="" value="60">60 ثانية</option>
<option value="120">120 ثانية</option>
</select>
</div>
<div class="grid cols3" id="stats" style="margin-bottom: 25px"></div>
<div id="passage" style="
              font: 22px/1.9 monospace;
              letter-spacing: 1px;
              background: var(--bg);
              padding: 25px;
              border-radius: 12px;
            "></div>
<textarea aria-label="إدخال الكتابة" autocomplete="off" id="input" placeholder="ابدأ بالكتابة هنا للبدء..." spellcheck="false" style="width: 100%; min-height: 160px; margin-top: 25px"></textarea>
<div class="actions" style="margin-top: 20px">
<button class="primary" id="restart">جلسة جديدة</button><button id="finish">انتهى الآن</button>
</div>
<p id="result" role="status"></p>
</section>
<aside class="panel">
<h2>أفضل ما لديك</h2>
<div class="metric" id="best"></div>
<p>
            يحسب WPM الأحرف المكتوبة بشكل صحيح، مقسمة على خمسة، في الدقيقة. تقارن الدقة النص الحالي بالمقطع. يُسمح بمسافة للخلف. اللصق لا يحسب.
          </p>
<h2>الجلسات الأخيرة</h2>
<div id="history"></div>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
