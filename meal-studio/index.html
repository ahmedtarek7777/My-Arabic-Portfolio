<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | مخطط الوجبات</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #dcc78a">
<header class="appbar">
<a class="brand" href="./">مخطط الوجبات<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">← جميع المشاريع</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">ستوديو أحمد / عرض تفاعلي</span>
<h1>القليل من التخطيط. طاولة أفضل.</h1>
</div>
<span class="muted">محلي أولاً · لا يلزم وجود حساب</span>
</div>
<div class="grid cols2">
<section class="panel">
<div class="row">
<h2>جمع الوصفات</h2>
<input aria-label="وصفات البحث" id="search" placeholder="ابحث عن وصفة"/>
</div>
<div class="grid cols2" id="recipes"></div>
<div id="detail" style="margin-top: 25px"></div>
</section>
<aside class="panel">
<h2>أسبوعك</h2>
<div id="plan"></div>
<h2 style="margin-top: 30px">قائمة التسوق</h2>
<p>
            تجمع الكميات بين حصص الوصفة القياسية المكونة من حصتين. ضبط لأسرتك.
          </p>
<div id="shopping"></div>
<button id="export">تنزيل قائمة التسوق</button>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
