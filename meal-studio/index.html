<!DOCTYPE html>

<html dir="rtl" lang="ar-EG">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | مخطط الوجبات</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #dcc78a">
<header class="appbar">
<a class="brand" href="./">مخطط الوجبات<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">→ كل المشروعات</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">من مشروعات أحمد / جرّب بنفسك</span>
<h1>هنطبخ إيه الأسبوع ده؟</h1>
</div>
<span class="muted">بياناتك على جهازك · من غير حساب</span>
</div>
<div class="grid cols2">
<section class="panel">
<div class="row">
<h2>اختار وصفة</h2>
<input aria-label="وصفات البحث" id="search" placeholder="ابحث عن وصفة"/>
</div>
<div class="grid cols2" id="recipes"></div>
<div id="detail" style="margin-top: 25px"></div>
</section>
<aside class="panel">
<h2>أسبوعك</h2>
<div id="plan"></div>
<h2 style="margin-top: 30px">قايمة المشتريات</h2>
<p>قايمة المشتريات محسوبة على حصتين لكل وصفة. زوّد أو قلّل الكميات على قد عددكم.</p>
<div id="shopping"></div>
<button id="export">نزّل قايمة المشتريات</button>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
