<!DOCTYPE html>

<html dir="rtl" lang="ar-EG">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | دفتر الرحلات</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #9ac7c2">
<header class="appbar">
<a class="brand" href="./">دفتر الرحلات<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">→ كل المشروعات</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">من مشروعات أحمد / جرّب بنفسك</span>
<h1>الرحلة الحلوة تبدأ بخطة.</h1>
</div>
<span class="muted">بياناتك على جهازك · من غير حساب</span>
</div>
<div class="notice">دي خطة ليك، مش خدمة حجز. مش بنحجز ولا بنحسب مشاوير ولا بنتأكد من التوافر. التكاليف إنت اللي بتكتبها بالجنيه المصري.</div>
<div class="grid cols3" id="stats"></div>
<div class="grid cols2" style="margin-top: 25px">
<section class="panel">
<div class="row">
<h2>خط سير الرحلة</h2>
<input aria-label="اسم الرحلة" id="tripName" placeholder="اسم هذه المغامرة"/>
</div>
<div id="days"></div>
<button id="export">نزّل خطة الرحلة</button>
</section>
<aside class="panel">
<h2>ضيف مكان للرحلة</h2>
<form class="stack" id="add">
<label>يوم<input id="day" required="" type="date"/></label><label>الوقت<input id="time" required="" type="time" value="09:00"/></label><label>المكان أو النشاط<input id="title" maxlength="120" required=""/></label><label>التكلفة المقدرة (بالجنيه المصري)<input id="cost" min="0" required="" step=".01" type="number" value="0"/></label><label>ملاحظات<textarea id="notes"></textarea></label><button class="primary">ضيف المكان للخطة</button>
</form>
<h2 style="margin-top: 30px">هتاخد إيه معاك؟</h2>
<form class="actions" id="packForm">
<input aria-label="عنصر التعبئة" id="pack" placeholder="جواز السفر، الشاحن..." required=""/><button>إضافة</button>
</form>
<div id="packing"></div>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
