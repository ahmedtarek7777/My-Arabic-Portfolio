<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | قسمة عادلة</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #98c2c9">
<header class="appbar">
<a class="brand" href="./">قسمة عادلة<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">← جميع المشاريع</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">ستوديو أحمد / عرض تفاعلي</span>
<h1>اللحظات المشتركة. النفقات المتوازنة.</h1>
</div>
<span class="muted">محلي أولاً · لا يلزم وجود حساب</span>
</div>
<div class="notice">
        حاسبة النفقات المحلية. لا يتم إرسال أي تحويلات أو طلبات دفع أو إشعارات. جميع المبالغ بالجنيه المصري.
      </div>
<div class="grid cols3" id="stats"></div>
<div class="grid cols2" style="margin-top: 25px">
<section class="panel">
<h2>مصاريف المجموعة</h2>
<div id="expenses"></div>
<h2 style="margin-top: 30px">التسويات المقترحة</h2>
<div id="settlements"></div>
<button id="export">مجموعة التصدير</button>
</section>
<aside class="panel">
<h2>مجموعتك</h2>
<form class="actions" id="addPerson">
<input aria-label="اسم الشخص" id="person" maxlength="40" placeholder="اسم الشخص" required=""/><button>إضافة عضو</button>
</form>
<div class="actions" id="people" style="margin: 18px 0"></div>
<h2>سجل نفقة</h2>
<form class="stack" id="add">
<label>الوصف<input id="title" maxlength="120" required=""/></label><label>المبلغ (بالجنيه المصري)<input id="amount" max="1000000" min=".01" required="" step=".01" type="number"/></label><label>مدفوع<select id="payer"></select></label><label>انقسم بالتساوي بين</label>
<div class="stack" id="participants"></div>
<button class="primary">إضافة النفقات</button>
</form>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
