<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | تقويم أيامي</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #e0b38c">
<header class="appbar">
<a class="brand" href="./">تقويم أيامي<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">← جميع المشاريع</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">ستوديو أحمد / عرض تفاعلي</span>
<h1>وقتك مرتب بعناية.</h1>
</div>
<span class="muted">محلي أولاً · لا يلزم وجود حساب</span>
</div>
<div class="grid cols2">
<section class="panel">
<div class="row">
<h2 id="monthName"></h2>
<div class="actions">
<button id="prev">←</button><button id="today">اليوم</button><button id="next">→</button>
</div>
</div>
<div id="calendar" style="
              display: grid;
              grid-template-columns: repeat(7, 1fr);
              gap: 7px;
            "></div>
</section>
<aside class="panel">
<h2 id="dayTitle"></h2>
<div id="events"></div>
<h2 style="margin-top: 25px">إضافة حدث</h2>
<form class="stack" id="add">
<label>العنوان<input id="title" maxlength="100" required=""/></label><label>التاريخ<input id="date" required="" type="date"/></label>
<div class="grid cols2">
<label>ابدأ<input id="time" required="" type="time" value="09:00"/></label><label>انتهى<input id="end" required="" type="time" value="10:00"/></label>
</div>
<label>ملاحظات<textarea id="notes"></textarea></label><button class="primary">حفظ الحدث</button>
</form>
<p>
            التقويم المحلي للجهاز، غير متزامن مع Google أو Apple. تستخدم الأوقات المنطقة الزمنية لجهازك.
          </p>
<button id="export">تصدير تقويم .ics</button>
</aside>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
