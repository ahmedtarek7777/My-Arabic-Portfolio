<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | حديقة العادات</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #b8ce8c">
<header class="appbar">
<a class="brand" href="./">حديقة العادات<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">← جميع المشاريع</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">ستوديو أحمد / عرض تفاعلي</span>
<h1>خطوات صغيرة، تقدم واضح.</h1>
</div>
<span class="muted">محلي أولاً · لا يلزم وجود حساب</span>
</div>
<div class="grid cols3" id="stats"></div>
<section class="panel" style="margin-top: 25px">
<div class="row">
<h2>إيقاعك الأسبوعي</h2>
<div class="actions">
<button id="prev">← الأسبوع</button><button id="today">هذا الأسبوع</button><button id="next">الأسبوع →</button>
</div>
</div>
<div class="tablewrap" id="grid"></div>
</section>
<div class="grid cols2" style="margin-top: 25px">
<section class="panel">
<h2>ازرع عادة جديدة</h2>
<form class="stack" id="add">
<label>اسم العادة<input id="name" maxlength="80" placeholder="اقرأ لمدة 20 دقيقة" required=""/></label><label>الفئة<select id="category">
<option value="Wellbeing">العافية</option>
<option value="Learning">تعلّم</option>
<option value="Fitness">اللياقة البدنية</option>
<option value="Mindfulness">اليقظة</option>
</select></label><button class="primary">خلق العادة</button>
</form>
</section>
<section class="panel">
<h2>الاتساق على الكمال.</h2>
<p>
            اضغط على اليوم لتسجيل العادة المكتملة. يحسب خطك الأيام المتتالية المكتملة حتى اليوم، أو الأمس عندما لا يزال اليوم أمامك.
          </p>
<button id="export">تقدم التصدير</button>
</section>
</div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
