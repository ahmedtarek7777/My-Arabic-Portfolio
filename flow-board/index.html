<!DOCTYPE html>

<html dir="rtl" lang="ar-EG">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>معرض اعمالي | لوحة المشروعات</title>
<link href="../studio.css?v=3" rel="stylesheet"/>
<link href="../arabic.css?v=1" rel="stylesheet"/></head>
<body style="--accent: #aac8dd">
<header class="appbar">
<a class="brand" href="./">لوحة المشروعات<span style="color: var(--accent)">.</span></a>
<div class="actions">
<a class="button" href="../#work">→ كل المشروعات</a><button aria-label="تبديل سمة اللون" id="theme">◐</button>
</div>
</header>
<main class="workspace">
<div class="titlebar">
<div>
<span class="badge">من مشروعات أحمد / جرّب بنفسك</span>
<h1>رتّب الشغل. واعرف الخطوة الجاية.</h1>
</div>
<span class="muted">بياناتك على جهازك · من غير حساب</span>
</div>
<div class="actions" style="margin-bottom: 22px">
<input aria-label="لوحة البحث" id="search" placeholder="ابحث في منتداك"/><button id="export">نزّل نسخة من اللوحة</button><label class="button">استيراد JSON<input accept=".json" hidden="" id="import" type="file"/></label>
</div>
<form class="panel actions" id="add" style="margin-bottom: 25px">
<input aria-label="عنوان المهمة" id="title" maxlength="160" placeholder="ما الذي يجب أن يحدث؟" required=""/><select aria-label="الأولوية" id="priority">
<option value="Normal">عادي</option>
<option value="High">العظمى</option>
<option value="Low">الصغرى</option></select><input aria-label="تاريخ الاستحقاق" id="due" type="date"/><button class="primary">
          إضافة بطاقة
        </button>
</form>
<div class="grid cols3" id="board"></div>
</main>
<script src="../studio.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="../arabic.js?v=1"></script></body>
</html>
